<template>
    <div class="un-pagination" if:true={totalPages}>
        <button class="un-page-btn" onclick={handlePrevious} disabled={isFirstPage} aria-label="Previous Page">
            &larr; Previous
        </button>
        <span class="un-page-info">
            Page <strong>{currentPage}</strong> of <strong>{totalPages}</strong>
        </span>
        <button class="un-page-btn" onclick={handleNext} disabled={isLastPage} aria-label="Next Page">
            Next &rarr;
        </button>
    </div>
</template>
