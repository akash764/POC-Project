<template>
    <div class="un-filter-panel">
        <div class="un-filter-row">
            <!-- 1. State Dropdown (1st) -->
            <div class="un-filter-group">
                <label for="filter-state" class="un-filter-label">State</label>
                <select id="filter-state" class="un-filter-select" value={selectedState} onchange={handleStateChange}>
                    <option value="">All States</option>
                    <template for:each={states} for:item="state">
                        <option key={state} value={state}>{state}</option>
                    </template>
                </select>
            </div>

            <!-- 2. City Dropdown (2nd - Dependent on State) -->
            <div class="un-filter-group">
                <label for="filter-city" class="un-filter-label">City</label>
                <select id="filter-city" class="un-filter-select" value={selectedCity} onchange={handleCityChange}>
                    <option value="">All Cities</option>
                    <template for:each={filteredCities} for:item="city">
                        <option key={city} value={city}>{city}</option>
                    </template>
                </select>
            </div>

            <!-- Clear Button -->
            <div class="un-filter-actions">
                <button class="un-btn-clear" onclick={handleClear} disabled={isClearDisabled}>
                    Reset Filters
                </button>
            </div>
        </div>
    </div>
</template>
